name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请説明使用场景，而不是只描述"想要一个按钮"。医馆实际流程背景会大幅提高被采纳的概率。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下需要它？现在是怎么将就的？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 挂号 / 就诊
        - 病历 / 质控 / AI
        - 处方 / 用药安全
        - 收费 / 会员
        - 药房 / 库存 / 追溯码
        - 报表 / 审计
        - 数据导入导出
        - 小程序患者端
        - 部署 / 运维
        - 其他
