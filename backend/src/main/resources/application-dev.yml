# 开发环境：H2 文件库（MySQL 兼容模式），开箱即用，无需安装数据库
spring:
  datasource:
    url: jdbc:h2:file:./data/fangjian;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

logging:
  level:
    com.fangjian.clinic: DEBUG
