# 便携版 / 本地部署专用配置
# 特点：单进程（后端同时托管前端）、数据写在程序目录下的 data/、日志写 logs/、启动自动备份
server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    # 相对路径：以启动目录（绿色版根目录）为基准，整个文件夹可整体拷贝迁移
    url: jdbc:h2:file:./data/yiguan;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: false

app:
  backup:
    enabled: true
    dir: ./backup
    keep: 7

logging:
  level:
    com.yiguan.his: INFO
  charset:
    file: UTF-8
  file:
    name: ./logs/yiguan-his.log
