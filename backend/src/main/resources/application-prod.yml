# 生产环境：MySQL 8（单机私有化部署，每家医馆一套）
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fangjian_clinic}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:fangjian}
    password: ${DB_PASSWORD:fangjian123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

logging:
  level:
    com.fangjian.clinic: INFO
