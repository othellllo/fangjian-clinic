server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: yiguan-his
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:yiguan-his-dev-secret-key-please-change-in-production-0123456789}
    expire-minutes: ${JWT_EXPIRE_MINUTES:720}
  patient:
    # 患者端（微信小程序）验证码：开发环境固定，接入短信服务商后改为真实校验
    login-code: ${PATIENT_LOGIN_CODE:123456}
  clinic:
    default-name: 青囊中医馆

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.yiguan.his: INFO
